services:
  kpss-tracker:
    build: .
    container_name: kpss-atama-takip
    restart: unless-stopped
    # Chromium (İlan.gov.tr) alt süreçlerinin zombi kalmasını önler; uzun süre çalışan sunucu için önemli
    init: true
    ports:
      # Varsayılan olarak yalnızca yerel makineden erişilir. Dışarı açmak için
      # bir ters vekil (HTTPS) ve .env içinde API_KEY kullanın.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - BROWSER_EXECUTABLE_PATH=/usr/bin/chromium
      # Kapsayıcı zaten izole olduğundan Chromium'un kendi sandbox'ı kapatılır
      - BROWSER_NO_SANDBOX=true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Konteyner stdout logları diski doldurmasın
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Sahiplik: uid 1000 (konteynerdeki 'app' kullanıcısı) yazabilmelidir
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
